<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="JunkSnap: snap the junk, prove it, get it cleared." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JunkSnap</title>
    <!-- Dark mode ka flash roko: React load hone se pehle hi theme laga do -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('junksnap-ui') || '{}').state || {};
          var t = s.theme || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
